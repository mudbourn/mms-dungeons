pluginManagement {
    repositories {
        maven { url = 'https://maven.fabricmc.net/' }
        mavenCentral()
        gradlePluginPortal()
    }
}

// Sibling mms mods, built from source. CI overrides the root with -PmmsSiblingRoot.
def siblingRoot = providers.gradleProperty('mmsSiblingRoot').getOrElse('..')
includeBuild "$siblingRoot/mms-economy"
includeBuild "$siblingRoot/mms-combat"
includeBuild "$siblingRoot/mms-render-common"
