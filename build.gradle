plugins {
    id 'net.fabricmc.fabric-loom' version "${loom_version}"
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

repositories {
    mavenCentral()
    maven { url "https://api.modrinth.com/maven" }
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${project.loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
    implementation "info.mudbourn:mms-economy:${project.economy_version}"
    implementation "info.mudbourn:mms-combat:${project.combat_version}"
    implementation "info.mudbourn:mms-render-common:${project.render_common_version}"
    // Third-party mods this mod calls into. The pack provides them at runtime.
    compileOnly files(
        "libs/26.3/open-parties-and-claims-fabric-26.3-0.33.0.jar",
        "libs/26.3/spell_engine-fabric-1.10.9+26.3.jar",
        "libs/26.3/spell_power-fabric-1.6.2+26.3.jar",
        "libs/26.3/aerialhell-0.7.9_fabric26.3.jar",
        "libs/26.3/cardinal-components-api-8.1.0.jar",
        "libs/26.3/alexscaves-1.1.3-fabric+26.3.jar",
        "libs/26.3/Origins-Legacy-1.12.20+26.3.jar",
        "libs/26.3/Calio-Legacy-1.11.4+26.3.jar",
        "libs/26.3/cardinal-components-base-8.1.0.jar",
        "libs/26.3/cardinal-components-entity-8.1.0.jar",
        "libs/26.3/bettercombat-fabric-3.2.2+26.3.jar",
        "libs/26.3/PlayerAnimationLibMerged-1.2.9+mc.26.3.jar",
        "libs/26.3/mocha-runtime-6.2.0.jar",
        "libs/26.3/cloth-config-fabric-26.3.159.jar",
        "libs/26.3/wthit-26.3-fabric-21.0.0.jar",
        "libs/26.3/trinkets-4.2.1+26.3.jar",
        "libs/26.3/mms-origins-1.8.9.jar"
    )
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = 25
}

java {
    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25

    withSourcesJar()
}

def netherDescentBiomes = [
    "minecraft:nether_wastes"   : "netherdescent:embur_bog",
    "minecraft:crimson_forest"  : "netherdescent:crimson_gardens",
    "minecraft:warped_forest"   : "netherdescent:sythian_torrids",
    "minecraft:soul_sand_valley": "netherdescent:wailing_garth",
    "minecraft:basalt_deltas"   : "netherdescent:arisian_undergrowth"
]

tasks.register("generateNetherDescentPack") {
    def dataDir = file("src/main/resources/data/mms_dungeons")
    def branches = file("src/nether_descent/material_rule_branches.json")
    def packDir = layout.buildDirectory.dir("generated/nether_descent")
    inputs.files(
        new File(dataDir, "dimension/dungeon.json"),
        new File(dataDir, "worldgen/material_rule/dungeon.json"),
        branches
    )
    inputs.property "biomes", netherDescentBiomes
    outputs.dir(packDir)
    doLast {
        def slurper = new groovy.json.JsonSlurper()
        def write = { File target, Object json ->
            target.parentFile.mkdirs()
            target.text = groovy.json.JsonOutput.prettyPrint(groovy.json.JsonOutput.toJson(json)) + "\n"
        }
        def root = packDir.get().asFile
        root.deleteDir()

        write(new File(root, "pack.mcmeta"), [
            pack: [
                description: "MMS Dungeons: Nether Descent biomes for Nether Infection",
                min_format : 97,
                max_format : 121
            ]
        ])

        def dimension = slurper.parse(new File(dataDir, "dimension/dungeon.json"))
        def entries = dimension.generator.biome_source.biomes
        netherDescentBiomes.each { vanilla, descent ->
            entries.findAll { it.biome == vanilla }.each { cell ->
                def range = cell.parameters.continentalness
                def middle = (range[0] + range[1]) / 2
                def upper = new LinkedHashMap(cell.parameters)
                upper.continentalness = [middle, range[1]]
                cell.parameters.continentalness = [range[0], middle]
                entries << [biome: descent, parameters: upper]
            }
        }
        write(new File(root, "data/mms_dungeons/dimension/dungeon.json"), dimension)

        def rule = slurper.parse(new File(dataDir, "worldgen/material_rule/dungeon.json"))
        def at = rule.sequence.indexOf("minecraft:overworld/copper_ore_vein")
        rule.sequence.addAll(at, slurper.parse(branches))
        write(new File(root, "data/mms_dungeons/worldgen/material_rule/dungeon.json"), rule)
    }
}

processResources {
    inputs.property "mod_version", project.mod_version
    filesMatching("fabric.mod.json") {
        expand "version": project.mod_version
    }
    from(tasks.named("generateNetherDescentPack")) {
        into "resourcepacks/nether_descent"
    }
}

jar {
    from("LICENSE") {
        rename { "${it}_${project.base.archivesName.get()}" }
    }
}
